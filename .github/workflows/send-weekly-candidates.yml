import os
import requests
from datetime import datetime

BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]
SUPABASE_URL = os.environ["SUPABASE_URL"]
SUPABASE_KEY = os.environ["SUPABASE_SERVICE_KEY"]

TELEGRAM_API = f"https://api.telegram.org/bot{BOT_TOKEN}"

def send_candidate(candidate):
    """Send a candidate to Telegram with approve/reject/defer buttons."""
    text = (
        f"📄 *{candidate['title'][:100]}*\n\n"
        f"👤 {candidate.get('author', 'Unknown')}\n"
        f"🏛 {candidate.get('institution', 'Unknown')}\n"
        f"📅 {candidate.get('year', 'Unknown')}\n\n"
        f"*Domain:* {candidate.get('proposed_domain', 'N/A')}\n"
        f"*Scores:* A:{candidate.get('authority_score', '?')} "
        f"E:{candidate.get('evidence_score', '?')} "
        f"R:{candidate.get('relevance_score', '?')}\n\n"
        f"*Summary:* {candidate.get('ai_summary', '')[:200]}...\n\n"
        f"🔗 [Read paper]({candidate.get('url', '#')})"
    )

    keyboard = {
        "inline_keyboard": [[
            {"text": "✅ Approve", "callback_data": f"approve:{candidate['id']}"},
            {"text": "❌ Reject", "callback_data": f"reject:{candidate['id']}"},
            {"text": "⏸ Defer", "callback_data": f"defer:{candidate['id']}"},
        ]]
    }

    requests.post(f"{TELEGRAM_API}/sendMessage", json={
        "chat_id": CHAT_ID,
        "text": text,
        "parse_mode": "Markdown",
        "reply_markup": keyboard,
    })

def main():
    # Fetch pending candidates from Supabase
    response = requests.get(
        f"{SUPABASE_URL}/rest/v1/review_queue",
        headers={
            "apikey": SUPABASE_KEY,
            "Authorization": f"Bearer {SUPABASE_KEY}",
        },
        params={"status": "eq.pending", "order": "created_at.desc", "limit": "10"},
    )
    candidates = response.json()

    if not candidates:
        requests.post(f"{TELEGRAM_API}/sendMessage", json={
            "chat_id": CHAT_ID,
            "text": "📭 No pending candidates this week.",
        })
        return

    # Send a summary first
    requests.post(f"{TELEGRAM_API}/sendMessage", json={
        "chat_id": CHAT_ID,
        "text": f"📚 *Weekly Library Review*\n\n{len(candidates)} candidates awaiting your review.",
        "parse_mode": "Markdown",
    })

    # Send each candidate
    for c in candidates:
        send_candidate(c)

if __name__ == "__main__":
    main()
